services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ollama_blobs:/root/.ollama/models/blobs
    restart: unless-stopped
    gpus: all

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  rag-web-ui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: rag-web-ui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_RAG=true
      # - RAG_EMBEDDING_ENGINE=openai
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=nomic-embed-text
      # - RAG_EMBEDDING_MODEL=text-embedding-3-small
      - RAG_EMBEDDING_DIM=768
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
      - TIKA_SERVER_URL=http://tika:9998
      - DOCLING_SERVER_URL=http://docling:5001
      - WEBUI_NAME=RAG WebUI
      - WEBUI_LANGUAGE=ja
      - RAG_CHUNK_SIZE=500
      - RAG_CHUNK_OVERLAP=80
      - CHUNK_MIN_SIZE_TARGET=120
    depends_on:
      - ollama
      - qdrant
      - tika
      - docling
    restart: unless-stopped
    volumes:
      - open-webui:/app/backend/data

  tika:
    image: apache/tika:latest-full
    container_name: tika
    ports:
      - "9998:9998"
    environment:
      - TIKA_OCR_LANGUAGE=jpn+eng
      - TIKA_PDF_OCR_STRATEGY=OCR_AND_TEXT_EXTRACTION
    restart: unless-stopped

  docling:
    image: quay.io/docling-project/docling-serve:latest
    container_name: docling
    ports:
      - "5001:5001"
    restart: unless-stopped
    environment:
      - DOCLING_SERVE_ENABLE_UI=true
      - DOCLING_OCR_LANGUAGE=jpn+eng

  post-train-ui:
    build: ./post-train-ui
    container_name: post-train-ui
    ports:
      - "8501:8501"
    volumes:
      - ollama_blobs:/models/blobs
      - ./post-train-ui:/app
      - ./llama.cpp:/llama.cpp
      - /home/ubuntu/llmstudio_mnt:/h2o-output:ro
    depends_on:
      - ollama
    restart: unless-stopped
  
  rag-convert-ui:
    build: ./rag-convert-ui
    container_name: rag-convert-ui
    ports:
      - "8502:8501"
    volumes:
      - ./rag-convert-ui:/app
    depends_on:
      - ollama
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - rag-web-ui
      - post-train-ui
      - rag-convert-ui
      # - llmstudio
    restart: unless-stopped

  # llmstudio:
  #   image: h2oairelease/h2oai-llmstudio-app:latest
  #   container_name: llmstudio
  #   runtime: nvidia
  #   restart: unless-stopped
