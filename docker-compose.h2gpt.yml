services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ollama_blobs:/root/.ollama/models/blobs
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  rag-web-ui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: rag-web-ui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_RAG=true
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=nomic-embed-text
      - RAG_EMBEDDING_DIM=768
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
    depends_on:
      - ollama
      - qdrant
    restart: unless-stopped

  h2ogpt:
    build: ./h2ogpt
    image: h2ogpt:latest
    container_name: h2ogpt
    ports:
      - "7860:7860"   # 可以保留，但不会用了
      - "5001:5000"
    environment:
      - OPENAI_BASE_URL=http://ollama:11434/v1
      - OPENAI_API_KEY=ollama
      - PYTHONUNBUFFERED=1
    volumes:
      - ~/.cache/huggingface:/workspace/.cache/huggingface
    shm_size: 2g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      generate.py
      --openai_server
      --port 5000
      --verbose
      --visible_gpus 0
      --hf_embedding_model=None
      --loader_exllama=False
      --no_exllama
      --langchain_mode=None
    depends_on:
      - ollama
    restart: unless-stopped

  post-train-ui:
    build: ./post-train-ui
    container_name: post-train-ui
    ports:
      - "8501:8501"
    volumes:
      - ollama_blobs:/models/blobs
      - ./post-train-ui:/app
      - ./llama.cpp:/llama.cpp
      - /home/ubuntu/llmstudio_mnt:/h2o-output:ro
    depends_on:
      - ollama
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rag-web-ui
      - post-train-ui
      - h2ogpt
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data:
  ollama_blobs:

networks:
  default:
    driver: bridge