  #     - ./nginx/llmstudio.conf:/etc/nginx/conf.d/default.conf
  #     - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
  #   depends_on:
  #     - llmstudio
  #   networks:
  #     - llm-net

networks:
  llm-net:
    driver: bridge