services:
  llmstudio:
    image: h2oairelease/h2oai-llmstudio-app:latest
    container_name: llmstudio
    runtime: nvidia
    restart: always
    ports:
      - "10101:10101"
    volumes:
      - ~/llmstudio_mnt:/mount
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    shm_size: 64g
    init: true
    networks:
      - llm-net

  nginx:
    image: nginx:alpine
    container_name: llmstudio-nginx
    restart: always
    ports:
      - "10101:80"           # 对外还是用 10101，也可以用别的端口如 8080
    volumes:
      - ./nginx/llmstudio.conf:/etc/nginx/conf.d/default.conf:ro
      - ./htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - llmstudio
    networks:
      - llm-net

networks:
  llm-net:
    driver: bridge